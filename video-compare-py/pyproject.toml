[build-system]
requires = ["maturin>=1.4,<2.0"]
build-backend = "maturin"

[project]
name = "video-compare-py"
version = "2.0.0"
description = "Video/image comparison library with SSIM, PSNR, MSE metrics"
requires-python = ">=3.9"
dependencies = ["av>=14.0.0", "Pillow>=10.0.0"]

[tool.maturin]
python-source = "python"
features = ["pyo3/extension-module"]
module-name = "video_compare._core"
