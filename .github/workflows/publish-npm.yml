# .github/workflows/publish-npm.yml
# 当推送 v* tag 时自动发布到 npm

name: Publish NPM

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  publish:
    name: Publish to NPM
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: "3.1.64"
          actions-cache-folder: "emsdk-cache"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake make

      - name: Build Wasm
        run: |
          mkdir -p build-wasm
          cd build-wasm
          emcmake cmake .. -DCMAKE_BUILD_TYPE=Release -DWASM_BUILD=ON
          emmake make -j$(nproc)

      - name: Copy Wasm to npm-package/dist
        run: |
          mkdir -p npm-package/dist
          cp build-wasm/video-compare.js npm-package/dist/
          cp build-wasm/video-compare.wasm npm-package/dist/
          ls -lh npm-package/dist/

      - name: Install npm dependencies
        working-directory: npm-package
        run: npm install

      - name: Build npm package
        working-directory: npm-package
        run: npm run build

      - name: Publish to NPM
        working-directory: npm-package
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Build summary
        if: always()
        run: |
          echo "## NPM Publish Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tag**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Package**: @video-compare/wasm" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### dist/ contents" >> $GITHUB_STEP_SUMMARY
          ls -lh npm-package/dist/ 2>/dev/null >> $GITHUB_STEP_SUMMARY || echo "N/A" >> $GITHUB_STEP_SUMMARY
