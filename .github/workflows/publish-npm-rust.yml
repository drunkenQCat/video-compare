# .github/workflows/publish-npm-rust.yml
# Rust WASM NPM 发布 — 当推送 v* tag 时自动发布到 npm
# 使用 OIDC provenance（无需 NPM_TOKEN secret）

name: Publish NPM (Rust)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # Required for OIDC provenance

jobs:
  build-and-publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"
          scope: "@cfai"

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: video-compare-wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Update package.json for npm
        working-directory: video-compare-wasm/pkg
        run: |
          # Read version from tag (e.g., v2.2.0 -> 2.2.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"

          # Update package.json
          cat package.json | jq \
            --arg name "@cfai/video-compare" \
            --arg version "$VERSION" \
            '.name = $name | .version = $version' > package.json.tmp
          mv package.json.tmp package.json

          echo "Updated package.json:"
          cat package.json

      - name: Publish to NPM
        working-directory: video-compare-wasm/pkg
        # OIDC provenance — no token needed
        run: npm publish --provenance --access public

      - name: Build summary
        run: |