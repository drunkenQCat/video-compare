# .github/workflows/publish-npm-rust.yml
# Rust WASM NPM 发布 — 当推送 v* tag 时自动发布到 npm
# 使用 OIDC Trusted Publisher（无需 NPM_TOKEN）

name: Publish NPM (Rust)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            video-compare-wasm/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('video-compare-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@cfai"

      - name: Check versions
        run: |
          node -v
          npm -v
          npm install -g npm@latest
          npm -v

      - name: Dump GitHub Context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT" | jq '{repository: .repository, workflow: .workflow, ref: .ref, actor: .actor, sha: .sha}'

      - name: Get OIDC JWT claims
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=registry.npmjs.org" | jq -r '.value')
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d. -f2)
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          echo "=== OIDC JWT Claims ==="
          echo "$PAYLOAD" | base64 -d | jq '{sub, repository, repository_owner, workflow, job_workflow_ref, ref, aud}'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: video-compare-wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Update package.json
        working-directory: video-compare-wasm/pkg
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"
          cat package.json | jq \
            --arg name "@cfai/video-compare" \
            --arg version "$VERSION" \
            --arg repo "git+https://github.com/drunkenQCat/video-compare.git" \
            '.name = $name
            | .version = $version
            | .publishConfig = {"access": "public"}
            | .repository.url = $repo
            | .repository.type = "git"' > package.json.tmp
          mv package.json.tmp package.json
          echo "=== Final package.json ==="
          cat package.json

      - name: Publish to NPM
        working-directory: video-compare-wasm/pkg
        run: npm publish --access public --loglevel silly

      - name: Print npm debug logs on failure
        if: failure()
        run: |
          echo "=== npm debug logs ==="
          find ~/.npm/_logs -type f -print
          cat ~/.npm/_logs/* 2>/dev/null || echo "No logs found"
