# .github/workflows/publish-npm-rust.yml
# Rust WASM NPM 发布 — 当推送 v* tag 时自动发布到 npm
# 使用 OIDC provenance（无需 NPM_TOKEN secret）
# 注意: Node 22.14+ / npm 11.5.1+ 为 Trusted Publishing 最低要求

name: Publish NPM (Rust)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write  # Required for OIDC provenance

jobs:
  build-and-publish:
    name: Build & Publish to NPM
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      id-token: write
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/cache/
            ~/.cargo/git/
            video-compare-wasm/target/
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('video-compare-wasm/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-
            ${{ runner.os }}-cargo-

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Node 22.14+ 是 Trusted Publishing 最低要求
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          scope: "@cfai"

      - name: Check versions
        run: |
          node -v
          npm -v

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Dump GitHub context
        env:
          GITHUB_CONTEXT: ${{ toJson(github) }}
        run: echo "$GITHUB_CONTEXT" | jq '{repository: .repository, workflow: .workflow, ref: .ref, actor: .actor, sha: .sha, run_number: .run_number, run_id: .run_id}'

      - name: Get OIDC JWT claims
        run: |
          # Request OIDC token from GitHub
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=registry.npmjs.org" | jq -r '.value')
          
          # Decode JWT payload (without signature)
          PAYLOAD=$(echo "$OIDC_TOKEN" | cut -d. -f2)
          # Base64 decode (add padding)
          case $((${#PAYLOAD} % 4)) in
            2) PAYLOAD="${PAYLOAD}==" ;;
            3) PAYLOAD="${PAYLOAD}=" ;;
          esac
          DECODED=$(echo "$PAYLOAD" | base64 -d 2>/dev/null || echo "$PAYLOAD" | openssl base64 -d 2>/dev/null)
          
          echo "=== OIDC JWT Claims ==="
          echo "$DECODED" | jq '{sub, repository, repository_owner, workflow, job_workflow_ref, ref, aud, issuer, sha, run_id}'

      - name: Install wasm-pack
        run: cargo install wasm-pack

      - name: Build WASM
        working-directory: video-compare-wasm
        run: wasm-pack build --target web --out-dir pkg

      - name: Update package.json for npm
        working-directory: video-compare-wasm/pkg
        run: |
          # Read version from tag (e.g., v2.2.0 -> 2.2.0)
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Publishing version: $VERSION"

          # Update package.json
          # repository.url 必须精确匹配 GitHub 仓库地址（npm Trusted Publishing 校验）
          cat package.json | jq \
            --arg name "@cfai/video-compare" \
            --arg version "$VERSION" \
            --arg repo "git+https://github.com/drunkenQCat/video-compare.git" \
            '.name = $name
            | .version = $version
            | .publishConfig = {"access": "public"}
            | .repository.url = $repo
            | .repository.type = "git"' > package.json.tmp
          mv package.json.tmp package.json

          echo "=== Updated package.json ==="
          cat package.json

      - name: Generate lock file for npm ci
        working-directory: video-compare-wasm/pkg
        run: npm install --package-lock-only

      - name: Publish to NPM
        working-directory: video-compare-wasm/pkg
        # OIDC provenance — no token needed
        run: |
          npm ci
          npm run build --if-present
          npm publish --provenance --access public --loglevel silly

      - name: Print npm debug logs on failure
        if: failure()
        run: |
          echo "=== npm debug logs ==="
          find ~/.npm/_logs -type f -print
          cat ~/.npm/_logs/* 2>/dev/null || echo "No logs found"

      - name: Build summary
        run: |
